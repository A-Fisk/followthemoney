services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: followthemoney
      POSTGRES_USER: ftm
      POSTGRES_PASSWORD: ftm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ftm:ftm@db:5432/followthemoney
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - uv-cache:/root/.cache/uv
    depends_on:
      - db
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  uv-cache:
